
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerar Código Ativador</title>

  <style>
    :root {
      --blue: #2777ff;
      --purple: #b440f2;
      --surface: #0b0c10;
      --line: #454750;
      --muted: #b8b8c0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 35px 12px;
      color: #fff;
      background: #000;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    main {
      width: min(100%, 384px);
    }

    .intro {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 48px;
      line-height: .55;
      font-weight: 700;
      letter-spacing: -7px;
      color: transparent;
      background: linear-gradient(115deg, var(--blue), var(--purple));
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 0 14px rgba(97, 74, 255, .24);
    }

    .dots {
      display: grid;
      grid-template-columns: repeat(3, 7px);
      gap: 6px;
      transform: translateY(2px);
      letter-spacing: 0;
    }

    .dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--purple));
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 7px 0 0;
      color: #adadb5;
      font-size: 15px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 17px;
      background: radial-gradient(
        circle at 50% -45%,
        #242735 0,
        var(--surface) 48%,
        #08090b 100%
      );
      box-shadow:
        inset 0 1px rgba(255,255,255,.05),
        0 11px 30px rgba(0,0,0,.3);
    }

    .entry {
      padding: 27px 30px 29px;
    }

    .instruction {
      margin: 0 0 21px;
      text-align: center;
      color: #d4d4da;
      font-size: 14px;
    }

    .code-inputs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .digit {
      width: 100%;
      min-width: 0;
      aspect-ratio: 1;
      border: 1px solid #565963;
      border-radius: 11px;
      outline: none;
      color: #fff;
      background: linear-gradient(145deg, #15171b, #070808);
      font: inherit;
      font-size: 34px;
      text-align: center;
      caret-color: #a14cff;
      transition: border-color .18s, box-shadow .18s, transform .18s;
    }

    .digit:focus {
      border-color: #8b64ff;
      box-shadow:
        0 0 0 2px rgba(111, 80, 255, .18),
        0 0 11px rgba(107, 72, 255, .23);
      transform: translateY(-1px);
    }

    .generate {
      width: 100%;
      margin-top: 23px;
      border: 1px solid rgba(255,255,255,.36);
      border-radius: 10px;
      padding: 11px 9px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(105deg, #126cff, #ab3be9);
      box-shadow:
        0 4px 13px rgba(106, 55, 255, .32),
        inset 0 1px rgba(255,255,255,.28);
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      transition: filter .2s, transform .2s;
    }

    .generate:hover,
    .copy:hover {
      filter: brightness(1.12);
    }

    .generate:active,
    .copy:active {
      transform: scale(.985);
    }

    .result {
      display: none;
      margin-top: 14px;
      padding: 21px 15px 20px;
      text-align: center;
    }

    .result.show {
      display: block;
      animation: show .26s ease-out;
    }

    @keyframes show {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .check {
      width: 33px;
      height: 33px;
      margin: 0 auto 13px;
      border: 1px solid #9c59ff;
      border-left-color: #2581ff;
      border-bottom-color: #2581ff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 300;
      color: #6789ff;
      transform: rotate(-8deg);
    }

    .result-label {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 1.2px;
    }

    .answer {
      margin: 10px 0 12px;
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 2px;
      color: transparent;
      background: linear-gradient(100deg, #207bff, #be40ee);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .copy {
      border: 1px solid #a4a4aa;
      border-radius: 9px;
      padding: 8px 15px;
      cursor: pointer;
      color: white;
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .copy span {
      color: #5276ff;
      margin-right: 6px;
      font-size: 15px;
    }

    .notice {
      min-height: 12px;
      margin: 8px 0 0;
      color: #aaa;
      font-size: 10px;
      text-align: center;
    }

    @media (max-width: 420px) {
      body {
        padding: 25px 10px;
      }

      main {
        width: min(100%, 340px);
      }

      .entry {
        padding: 22px 18px 24px;
      }

      .code-inputs {
        gap: 9px;
      }

      .digit {
        border-radius: 9px;
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <main>

    <section class="intro" aria-labelledby="title">

      <div class="brand-mark" aria-hidden="true">
        #
        <span class="dots">
          <i></i><i></i><i></i>
          <i></i><i></i><i></i>
        </span>
      </div>

      <h1 id="title">Gerar Código Ativador</h1>

      <p class="subtitle">Unitv Free</p>

    </section>


    <section class="card entry" aria-label="Gerador de código">

      <p class="instruction">
        Digite os 4 números exibidos na TV
      </p>

      <div class="code-inputs">

        <input
          class="digit"
          inputmode="numeric"
          maxlength="1"
          autocomplete="off"
          aria-label="Primeiro número"
        >

        <input
          class="digit"
          inputmode="numeric"
          maxlength="1"
          autocomplete="off"
          aria-label="Segundo número"
        >

        <input
          class="digit"
          inputmode="numeric"
          maxlength="1"
          autocomplete="off"
          aria-label="Terceiro número"
        >

        <input
          class="digit"
          inputmode="numeric"
          maxlength="1"
          autocomplete="off"
          aria-label="Quarto número"
        >

      </div>

      <button class="generate" type="button">
        GERAR CÓDIGO
      </button>

      <p class="notice" id="notice" role="alert"></p>

    </section>


    <section
      class="card result"
      id="result"
      aria-live="polite"
    >

      <div class="check">✓</div>

      <p class="result-label">
        SEU CÓDIGO DE ATIVAÇÃO
      </p>

      <p class="answer" id="answer">
        000000
      </p>

      <button class="copy" type="button" id="copy">
        <span>▣</span>COPIAR
      </button>

    </section>

  </main>


  <script>

    const fields = [
      ...document.querySelectorAll('.digit')
    ];

    const notice = document.querySelector('#notice');
    const result = document.querySelector('#result');
    const answer = document.querySelector('#answer');


    /* ==============================
       CAMPOS DOS 4 DÍGITOS
    ============================== */

    fields.forEach((field, index) => {

      field.addEventListener('input', () => {

        field.value = field.value
          .replace(/\D/g, '')
          .slice(0, 1);

        if (
          field.value &&
          index < fields.length - 1
        ) {
          fields[index + 1].focus();
        }

      });


      field.addEventListener('keydown', event => {

        if (
          event.key === 'Backspace' &&
          !field.value &&
          index > 0
        ) {
          fields[index - 1].focus();
        }

      });


      field.addEventListener('paste', event => {

        const digits =
          event.clipboardData
            .getData('text')
            .replace(/\D/g, '')
            .slice(0, 4);

        if (!digits) return;

        event.preventDefault();

        digits.split('').forEach((digit, i) => {

          if (fields[index + i]) {
            fields[index + i].value = digit;
          }

        });

        fields[
          Math.min(index + digits.length, 3)
        ].focus();

      });

    });


    /* ==============================
       GERADOR DO CÓDIGO
    ============================== */

    function generateCode(value) {

      let n = Number.parseInt(value, 10);

      const key = 918273645;

      n = n * 7919;
      n += key;

      n = (n | 0) ^ 0x5A5A;

      n = n * 97;
      n += 654321;

      n = (n | 0) ^ (key >> 8);

      n = n * 37;
      n += 123456;

      n = (n | 0) ^ 0xA3F2;

      n = n * 43;

      return String(
        Math.abs(n) % 1000000
      ).padStart(6, '0');

    }


    /* ==============================
       BOTÃO GERAR
    ============================== */

    document
      .querySelector('.generate')
      .addEventListener('click', () => {

        const input =
          fields
            .map(field => field.value)
            .join('');

        if (input.length !== 4) {

          notice.textContent =
            'Digite os 4 números para gerar o código.';

          fields
            .find(field => !field.value)
            ?.focus();

          return;
        }

        notice.textContent = '';

        answer.textContent =
          generateCode(input);

        result.classList.add('show');

        result.scrollIntoView({
          behavior: 'smooth',
          block: 'nearest'
        });

      });


    /* ==============================
       COPIAR CÓDIGO
    ============================== */

    document
      .querySelector('#copy')
      .addEventListener('click', async () => {

        try {

          await navigator.clipboard.writeText(
            answer.textContent
          );

          notice.textContent =
            'Código copiado.';

        } catch {

          notice.textContent =
            'Não foi possível copiar automaticamente.';

        }

      });

  </script>

</body>
</html>
